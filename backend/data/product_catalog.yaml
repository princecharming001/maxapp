# Authoritative product catalog (Superpower biohacking programs).
#
# Every product the coach can put on a product card lives here. Each entry is
# a DIRECT Amazon US product page (never a search). The agent's
# `recommend_product` tool reads from here, the link rewriter resolves brand
# mentions against here, and the link validator rejects URLs not in here.
#
# Adding or changing a product:
#   1. It must serve a real habit in a program doc under backend/ai_programs/
#      (habit ids make good `concerns`). Supplements: follow suppmax.md (dose
#      ranges, safety notes) and prefer USP Verified / NSF Certified for Sport /
#      Informed Choice products. Peptidemax: non-drug support gear ONLY, never a
#      peptide, research chemical or anything that implies a source for one.
#   2. Find the ASIN, then confirm it opens that exact product, is buyable and
#      has a real image: `python scripts/verify_product_catalog.py --asin <ASIN>`.
#      NEVER paste an ASIN you have not confirmed.
#   3. Copy the page's main image (https://m.media-amazon.com/images/I/...).
#      /images/P/<ASIN>.jpg URLs are placeholders and not allowed.
#   4. Run `python scripts/verify_product_catalog.py`; every active entry must be OK.
#
# Schema (all strings unless noted):
#   id            stable kebab-case slug, unique
#   name          display name shown to user (keep it close to the Amazon title:
#                 the verifier needs >=50% of its words in the page title)
#   brand         brand the user knows (must appear in the page title/byline)
#   module        sleepmax | energymax | focusmax | calmmax | trainmax (shown as
#                 "Fitmax") | skinhairmax | longevitymax | suppmax | peptidemax |
#                 general | retired  (retired = kept for history, NEVER recommend)
#   concerns      [str] >=3 lowercase snake_case keywords a coach would search
#                 for, including the habit ids the product serves
#   url           https://www.amazon.com/dp/<ASIN>  (nothing else)
#   image         main product image from the page: https://m.media-amazon.com/images/I/...
#   price_tier    budget (<~$20) | mid (~$20-60) | premium (>~$60), at time of verification
#   tags          dict of fact-flags (true/false/null=unknown). The catalog filter
#                 drops a product when a user fact requires a flag that is not true:
#                   vegetarian / vegan / gluten_free / dairy_free  (diet)
#                   fragrance_free / sulfate_free / cruelty_free   (topicals)
#                 Flags are set from the product page or label; unknown stays null.
#                 For non-consumable gear the diet/allergen flags mean "no conflict"
#                 (true), except animal materials such as silk (vegan: false).
#   rationale     one short sentence, <=120 chars, no medical or treatment claims
#   references    [str] backend-relative docs that endorse it, e.g. ai_programs/sleepmax.md
#   slug          title-case slug used to render the long-form Amazon URL
#   strength      optional: labelled strength of ONE serving ("3 mg", "1,000 IU").
#                 Read off the name when absent (mg/mcg/IU only). Task guides
#                 compare it with the Suppmax dose range for the habit.
#
# Last full verification: 2026-10-13 (scripts/verify_product_catalog.py).

products:

